# /opt/arr/docker-compose.yml
# Library management for the Cinemat Jellyfin server.
#
# Bridge-networked: Docker DNATs past ufw. DOCKER-USER drops tailscale0 ->
# container traffic, so these admin UIs are LAN-only (not over Tailscale).
#
# Single /data mount lets Radarr/Sonarr hardlink completed downloads into the
# library instead of copying across separate bind mounts.

x-arr-common: &arr-common
  restart: unless-stopped
  environment: &arr-env
    PUID: "1000"
    PGID: "1000"
    TZ: Asia/Tashkent
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  qbittorrent:
    <<: *arr-common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *arr-env
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./qbittorrent:/config
      - /mnt/storage:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080 | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  radarr:
    <<: *arr-common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./radarr:/config
      - /mnt/storage:/data
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  sonarr:
    <<: *arr-common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./sonarr:/config
      - /mnt/storage:/data
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  prowlarr:
    <<: *arr-common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ./prowlarr:/config
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
