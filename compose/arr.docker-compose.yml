# /opt/arr/docker-compose.yml
# Library management for the Cinemat Jellyfin server.
#
# Bridge-networked: Docker DNATs past ufw. DOCKER-USER drops tailscale0 ->
# container traffic, so these admin UIs are LAN-only (not over Tailscale).
#
# Single /data mount lets Radarr/Sonarr hardlink completed downloads into the
# library instead of copying across separate bind mounts.
#
# The subnet is pinned. Jellyfin is host-networked, so ufw genuinely filters it,
# and Radarr/Sonarr reach it from this bridge to trigger a library refresh --
# which needs a ufw rule naming this subnet (see scripts/03-firewall.sh). Left to
# Docker's default pool the subnet can change when the network is recreated, and
# that rule would silently stop matching.

x-arr-common: &arr-common
  restart: unless-stopped
  environment: &arr-env
    PUID: "1000"
    PGID: "1000"
    TZ: Asia/Tashkent
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  qbittorrent:
    <<: *arr-common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *arr-env
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./qbittorrent:/config
      - /mnt/storage:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080 | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  radarr:
    <<: *arr-common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./radarr:/config
      - /mnt/storage:/data
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  sonarr:
    <<: *arr-common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./sonarr:/config
      - /mnt/storage:/data
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  prowlarr:
    <<: *arr-common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ./prowlarr:/config
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Search/request front end. This is the piece that answers "find me a film" --
  # Jellyfin only ever searches files already on disk, so a request layer in front
  # of Radarr/Sonarr is what makes searching a catalogue possible at all.
  # Reaches Radarr/Sonarr by container name, and Jellyfin over host.docker.internal
  # (allowed by the 172.20.0.0/24 ufw rule in scripts/03-firewall.sh).
  jellyseerr:
    <<: *arr-common
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      <<: *arr-env
      LOG_LEVEL: info
      PORT: "5055"
    volumes:
      - ./jellyseerr:/app/config
    ports:
      - "5055:5055"
    depends_on:
      - radarr
      - sonarr
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5055/api/v1/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  default:
    name: arr_default
    ipam:
      config:
        - subnet: 172.20.0.0/24
